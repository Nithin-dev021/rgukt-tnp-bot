name: Keep Bot Awake

on:
  schedule:
    # Run every 10 minutes to reset Render's 15-minute idle sleep timer
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render Web Service
        run: |
          curl -s -f --connect-timeout 10 --max-time 15 "https://rgukt-tnp-bot.onrender.com" || echo "Ping completed"
